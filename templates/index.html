<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DXF → SVG Viewer</title>
</head>
<body>
    <h1>DXF → SVG Viewer</h1>
    <input type="file" id="fileInput" accept=".dxf">
    <div id="result"></div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const resultDiv = document.getElementById("result");

        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            resultDiv.innerHTML = "変換中…";

            try {
                const res = await fetch("/upload-svg", {
                    method: "POST",
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    resultDiv.innerHTML = "変換エラー: " + (err.error || "不明なエラー");
                    return;
                }

                const svgText = await res.text();
                resultDiv.innerHTML = svgText; // SVG をそのまま表示

            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = "アップロード失敗";
            }
        });
    </script>
</body>
</html>
