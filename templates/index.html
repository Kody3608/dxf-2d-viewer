<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DXF → SVG Viewer</title>
</head>
<body>
    <h1>DXF → SVG Viewer via Vector Express API</h1>
    <input type="file" id="fileInput" accept=".dxf">
    <div id="result"></div>

    <script>
        document.getElementById("fileInput").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const form = new FormData();
            form.append("file", file);

            const res = await fetch("/upload-svg", {
                method: "POST",
                body: form
            });

            if (!res.ok) {
                const err = await res.json();
                alert("変換エラー: " + err.error);
                return;
            }

            const svgText = await res.text();
            document.getElementById("result").innerHTML = svgText;
        });
    </script>
</body>
</html>
